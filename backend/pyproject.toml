[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "fileora"
version = "0.1.0"
description = "Private local semantic, lexical and multimodal file search"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic>=2.10,<3",
  "numpy>=2,<3",
  "faiss-cpu>=1.10,<2",
  "pypdf>=5,<7",
  "pillow>=11,<13",
  "watchdog>=6,<8",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
ml = ["sentence-transformers>=3.4,<6", "transformers>=4.49,<6", "torch>=2.6,<3", "huggingface-hub>=0.28,<2"]
ocr = ["pytesseract>=0.3.13,<1", "pypdfium2>=4.30,<6"]
code = ["tree-sitter>=0.25,<0.27", "tree-sitter-python>=0.23,<0.26", "tree-sitter-java>=0.23,<0.24"]
media = ["faster-whisper>=1.1,<2", "av>=14,<18"]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1", "mypy>=1.15,<2"]

[project.scripts]
fileora = "fileora.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fileora"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["model: requires prepared local ML models", "media: requires media dependencies"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{index = "pytorch-cpu", marker = "sys_platform == 'win32' or sys_platform == 'linux'"}]
